<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --surface-color: rgba(30, 41, 59, 0.7);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            --border-color: rgba(255, 255, 255, 0.08);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(129, 140, 248, 0.05) 0%, transparent 40%);
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--surface-color);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: var(--shadow-glass);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 20px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth;
        }

        .message {
            max-width: 75%;
            padding: 14px 18px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.5;
            animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* JETZT NEU: User-Text ist grau */
        .message.user {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        /* JETZT NEU: AI-Text hat den blau-violetten Farbverlauf */
        .message.ai {
            background: var(--accent-gradient);
            color: #0f172a;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            font-weight: 600;
        }

        /* Roter Text für ungelernte Prompts */
        .message.ai.error-text {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.4);
            color: #f43f5e !important;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 14px 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            width: fit-content;
        }

        .typing-dot {
            width: 7px;
            height: 7px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: pulse 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) { animation-delay: 0s; }
        .typing-dot:nth-child(2) { animation-delay: 0.2s; }
        .typing-dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .chat-input-area {
            padding: 20px 24px;
            border-top: 1px solid var(--border-color);
            background: rgba(15, 23, 42, 0.4);
            display: flex;
            gap: 12px;
        }

        .chat-input {
            flex: 1;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .chat-input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        .send-button {
            background: var(--accent-gradient);
            border: none;
            border-radius: 14px;
            padding: 0 20px;
            color: #0f172a;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .send-button:hover {
            opacity: 0.9;
        }

        .send-button:active {
            transform: scale(0.96);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div id="chatMessages" class="chat-messages">
            <!-- Dynamische Nachrichten -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="userInput" class="chat-input" placeholder="Prompt eingeben..." autocomplete="off">
            <button id="sendBtn" class="send-button" onclick="sendMessage()">Senden</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            projectId: "skyai-1e930"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let knowledgeBase = [];

        async function loadKnowledge() {
            try {
                const querySnapshot = await getDocs(collection(db, "ki_wissen"));
                querySnapshot.forEach((doc) => {
                    knowledgeBase.push(doc.data());
                });
            } catch (e) {
                console.error("Fehler beim Lesen der Datenbank:", e);
            }
        }
        loadKnowledge();

        let chatHistory = JSON.parse(localStorage.getItem('skyai_main_chat')) || [
            { sender: 'ai', text: 'Hallo. Wie kann ich dir helfen?', isError: false }
        ];

        const messagesContainer = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        let isThinking = false;

        function cleanText(str) {
            return str
                .toLowerCase()
                .replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?]/g, "")
                .replace(/\s+/g, " ")
                .trim();
        }

        function renderChat() {
            messagesContainer.innerHTML = '';
            
            if (chatHistory.length > 40) {
                chatHistory = chatHistory.slice(chatHistory.length - 40);
            }

            chatHistory.forEach(msg => {
                const div = document.createElement('div');
                div.className = `message ${msg.sender}${msg.isError ? ' error-text' : ''}`;
                div.innerText = msg.text;
                messagesContainer.appendChild(div);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
            localStorage.setItem('skyai_main_chat', JSON.stringify(chatHistory));
        }

        window.sendMessage = function() {
            if (isThinking) return;
            const rawText = userInput.value;
            const text = rawText.trim();
            if (!text) return;

            chatHistory.push({ sender: 'user', text: text, isError: false });
            userInput.value = '';
            renderChat();

            isThinking = true;
            userInput.disabled = true;
            sendBtn.disabled = true;

            const typingIndicator = document.createElement('div');
            typingIndicator.className = 'typing-indicator';
            typingIndicator.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
            messagesContainer.appendChild(typingIndicator);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            setTimeout(() => {
                if (typingIndicator.parentNode) {
                    typingIndicator.parentNode.removeChild(typingIndicator);
                }

                let aiResponse = "";
                let isError = false;
                const cleanedUserText = cleanText(rawText);

                // Suche nach Treffern in der Datenbank
                let matches = knowledgeBase.filter(item => {
                    if (!item.frage) return false;
                    const cleanedDbFrage = cleanText(item.frage);
                    return cleanedUserText === cleanedDbFrage;
                });

                if (matches.length === 0) {
                    matches = knowledgeBase.filter(item => {
                        if (!item.frage) return false;
                        const cleanedDbFrage = cleanText(item.frage);
                        return cleanedUserText.length > 3 && cleanedDbFrage.length > 3 && cleanedUserText.includes(cleanedDbFrage);
                    });
                }

                if (matches.length > 0) {
                    const randomIndex = Math.floor(Math.random() * matches.length);
                    aiResponse = matches[randomIndex].antwort;
                } else {
                    // Falls nach einer Zahl gefragt wird, generiert die KI dynamisch eine Zahl zwischen 1 und 10
                    if (cleanedUserText.includes("zahl") || cleanedUserText.includes("nummer")) {
                        const randomNumber = Math.floor(Math.random() * 10) + 1;
                        aiResponse = `Hier ist deine Zahl: ${randomNumber}`;
                    } else {
                        // Fehlgeschlagene Frage: Rot dargestellter Text
                        aiResponse = "Error 404";
                        isError = true;
                    }
                }

                chatHistory.push({ sender: 'ai', text: aiResponse, isError: isError });
                renderChat();

                isThinking = false;
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }, 2000);
        }

        userInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        renderChat();
    </script>
</body>
</html>
